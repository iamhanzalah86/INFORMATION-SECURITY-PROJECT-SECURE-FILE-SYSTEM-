{% extends 'auth_base.html' %}
{% block title %}Forgot password{% endblock %}
{% block body %}
<h1>Forgot your password?</h1>
<p class="sub">Enter your account email and we'll send you a 6-digit reset code.</p>
<form method="POST" data-once>
  {{ csrf() }}
  <div class="field">
    <label for="email">Email address</label>
    <div class="input-wrap">{{ icon('mail') }}
      <input class="input" id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus></div>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Send reset code {{ icon('arrow') }}</button>
</form>
<p class="auth-foot"><a href="{{ url_for('main.login') }}">&larr; Back to log in</a></p>
{% endblock %}
